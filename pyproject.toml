[project]
name = "mcp-dynamodb-user-server"
version = "1.0.0"
description = "MCP server for retrieving user information from DynamoDB"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=0.9.0",
    "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
mcp-dynamodb-user-server = "mcp_dynamodb_user_server.server:main"
